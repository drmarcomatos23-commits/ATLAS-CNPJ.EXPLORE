<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS LEGALIZAÇÃO E GERENCIAMENTO</title>
<meta name="description" content="Gestão de legalização empresarial, processos, protocolos, custos e licenças.">
<style>
:root{--navy:#10263f;--navy2:#173b62;--teal:#18a7a0;--bg:#f4f7fb;--card:#fff;--line:#dfe7ef;--text:#172233;--muted:#6d7a8c;--ok:#20875d;--warn:#c77a13;--bad:#c94b55}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--teal);color:#fff}.ghost{background:#edf2f7;color:#33455c}
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:7vw;padding:7vw;background:linear-gradient(135deg,#0d2035,#173f64 55%,#0d7173)}
.brand{color:#fff}.brand h1{font-size:48px;line-height:1.03;margin:0 0 12px;max-width:760px}.brand p{font-size:19px;opacity:.78}.mark{width:86px;height:86px;border-radius:24px;border:1px solid #ffffff55;display:grid;place-items:center;font-size:29px;font-weight:900;margin-bottom:22px;background:#ffffff12}
.loginCard{background:#fff;padding:34px;border-radius:24px;box-shadow:0 30px 80px #0004}.loginCard h2{font-size:30px;margin:4px 0 6px}.loginCard label{display:block;font-size:12px;font-weight:800;margin:15px 0 6px}.loginCard input,.loginCard select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px}.note{font-size:12px;color:var(--muted);margin-top:12px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.side h2{font-size:14px;margin:0 0 18px;padding:0 8px}.side nav{display:flex;flex-direction:column;gap:5px}.side nav button{background:transparent;color:#c8d4e0;border:0;text-align:left;padding:11px 12px;border-radius:9px;font-weight:700;cursor:pointer}.side nav button.active,.side nav button:hover{background:#ffffff17;color:#fff}.side .foot{margin-top:auto;font-size:12px;color:#9fb2c5;padding:12px 8px}
.main{min-width:0}.top{height:86px;background:#ffffffee;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:18px 28px;position:sticky;top:0;z-index:5}.top h1{font-size:24px;margin:0}.top small{display:block;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}.content{padding:26px 28px 60px}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px #1f344b0b}.kpi strong{display:block;font-size:30px;margin-top:7px}.kpi span{font-size:12px;color:var(--muted)}
.split{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-top:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.toolbar h3{margin:0}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;background:#edf2f6;color:#506176}.ok{background:#e5f5ee;color:var(--ok)}.warn{background:#fff1db;color:#9a5d08}.bad{background:#fae8ea;color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf1f4;text-align:left;font-size:13px}th{font-size:11px;color:#718096;text-transform:uppercase;background:#f9fbfd}.wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.kanban{display:grid;grid-template-columns:repeat(6,245px);gap:12px;overflow:auto;padding-bottom:6px}.col{background:#edf3f7;border-radius:13px;padding:10px;min-height:380px}.colHead{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:#56677a;margin-bottom:10px}.proc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px}.proc b{display:block;font-size:13px}.proc p{font-size:11px;color:var(--muted);margin:5px 0}.progress{height:6px;border-radius:99px;background:#e6edf3;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}.row strong{font-size:13px}.row small{display:block;color:var(--muted);margin-top:3px}
.searchbox{display:flex;gap:8px}.searchbox input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px}.result{white-space:pre-wrap;background:#0f1d2c;color:#d9e7f3;border-radius:12px;padding:14px;min-height:100px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.shell{grid-template-columns:76px 1fr}.side h2{font-size:0}.side nav button{font-size:0;text-align:center}.side nav button:before{content:"•";font-size:20px}.side .foot{display:none}}
@media(max-width:650px){.login{grid-template-columns:1fr;padding:22px}.brand{display:none}.shell{display:block}.side{height:auto;width:100%;position:fixed;top:auto;bottom:0;z-index:10;display:block;padding:6px}.side h2,.side .foot{display:none}.side nav{flex-direction:row;overflow:auto}.side nav button{min-width:48px}.content{padding:18px 14px 76px}.top{padding:14px;height:74px}.top .btn{display:none}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="brand"><div class="mark">AL</div><h1>ATLAS LEGALIZAÇÃO E GERENCIAMENTO</h1><p>Gestão de legalização empresarial, licenças, protocolos, custos e relacionamento com clientes.</p></div>
  <div class="loginCard">
    <div style="color:#18a7a0;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase">Acesso de demonstração</div>
    <h2>Bem-vindo</h2>
    <label>E-mail</label><input id="email" value="admin@atlas.local">
    <label>Senha</label><input id="pass" type="password" value="demo123">
    <label>Perfil</label><select id="role"><option>Administrador</option><option>Legalização / Operação</option><option>Financeiro</option><option>Cliente</option></select>
    <button class="btn primary" style="width:100%;margin-top:18px" onclick="enterApp()">Entrar</button>
    <div class="note">Preview isolado. Não altera o ATLAS CNPJ Explore em produção.</div>
  </div>
</section>

<div id="app" class="shell hidden">
<aside class="side">
  <h2>ATLAS LEGALIZAÇÃO</h2>
  <nav id="nav">
    <button class="active" data-page="dashboard">Dashboard</button>
    <button data-page="processos">Processos</button>
    <button data-page="clientes">Clientes</button>
    <button data-page="protocolos">Protocolos</button>
    <button data-page="custos">Custos</button>
    <button data-page="licencas">Licenças</button>
    <button data-page="integracoes">Integrações</button>
  </nav>
  <div class="foot">ATLAS · ambiente preview</div>
</aside>
<main class="main">
  <header class="top"><div><small id="kicker">Visão geral</small><h1 id="title">Dashboard</h1></div><button class="btn primary" onclick="newProcess()">+ Novo processo</button></header>
  <section id="content" class="content"></section>
</main>
</div>

<script>
var stages=['Briefing','Viabilidade','DBE / Receita','Registro','Inscrições','Licenciamento'];
var clients=[
{id:'c1',name:'Alfa Participações Ltda',cnpj:'12.345.678/0001-10',city:'Santos/SP',contact:'Camila Souza'},
{id:'c2',name:'Beta Logística S.A.',cnpj:'22.345.678/0001-20',city:'São Paulo/SP',contact:'Rafael Lima'},
{id:'c3',name:'Clínica Horizonte Ltda',cnpj:'32.345.678/0001-30',city:'Praia Grande/SP',contact:'Ana Reis'}];
var processes=[
{id:'LEG-2026-041',client:'Alfa Participações Ltda',title:'Constituição Holding Patrimonial',stage:1,owner:'Mariana',deadline:'08/10/2026',progress:22,status:'Em andamento'},
{id:'LEG-2026-038',client:'Beta Logística S.A.',title:'Alteração de endereço e CNAEs',stage:3,owner:'Lucas',deadline:'03/10/2026',progress:51,status:'Em andamento'},
{id:'LEG-2026-035',client:'Clínica Horizonte Ltda',title:'Licença Sanitária + AVCB',stage:5,owner:'Fernanda',deadline:'30/09/2026',progress:78,status:'Pendência'}];
var protocols=[
{proc:'LEG-2026-041',org:'Prefeitura de Santos',kind:'Viabilidade',num:'VIA-2026-77831',status:'Em análise'},
{proc:'LEG-2026-038',org:'JUCESP',kind:'Registro',num:'SPN2601188002',status:'Deferido'}];
var costs=[
{proc:'LEG-2026-041',desc:'Taxa de registro',type:'DARE',amount:'R$ 286,52',status:'Pago'},
{proc:'LEG-2026-035',desc:'Taxa sanitária municipal',type:'Taxa Municipal',amount:'R$ 412,80',status:'Pago'},
{proc:'LEG-2026-038',desc:'Emolumentos',type:'Junta Comercial',amount:'R$ 175,00',status:'A pagar'}];
var licenses=[
{client:'Clínica Horizonte Ltda',name:'Licença Sanitária',exp:'22/10/2026',status:'Vencendo'},
{client:'Beta Logística S.A.',name:'AVCB - Unidade SP',exp:'14/03/2027',status:'Regular'},
{client:'Alfa Participações Ltda',name:'Alvará de Funcionamento',exp:'15/12/2026',status:'Atenção'}];

function badge(s){var c=/defer|regular|pago/i.test(s)?'ok':/pend|venc/i.test(s)?'bad':'warn';return '<span class="badge '+c+'">'+s+'</span>'}
function enterApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render('dashboard')}
document.getElementById('nav').onclick=function(e){if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('#nav button').forEach(function(b){b.classList.remove('active')});e.target.classList.add('active');render(e.target.dataset.page)}
function head(t,k){document.getElementById('title').textContent=t;document.getElementById('kicker').textContent=k||'ATLAS'}
function render(p){
 if(p==='dashboard')return dashboard();
 if(p==='processos')return processPage();
 if(p==='clientes')return clientPage();
 if(p==='protocolos')return protocolPage();
 if(p==='custos')return costPage();
 if(p==='licencas')return licensePage();
 if(p==='integracoes')return integrationPage();
}
function dashboard(){
 head('Dashboard','Visão geral');
 var html='<div class="grid kpis">'+
 '<div class="card kpi"><span>Processos ativos</span><strong>'+processes.length+'</strong><span>Fluxos em andamento</span></div>'+
 '<div class="card kpi"><span>Licenças em atenção</span><strong>2</strong><span>Alertas 90/60/30 dias</span></div>'+
 '<div class="card kpi"><span>Protocolos</span><strong>'+protocols.length+'</strong><span>Órgãos públicos</span></div>'+
 '<div class="card kpi"><span>Custos controlados</span><strong>R$ 874</strong><span>Taxas e reembolsos</span></div></div>'+
 '<div class="split"><div class="card"><div class="toolbar"><h3>Processos recentes</h3><span class="badge">Kanban operacional</span></div>'+tableProcesses()+'</div>'+
 '<div class="card"><h3>Próximos vencimentos</h3>'+licenses.map(function(l){return '<div class="row"><div><strong>'+l.name+'</strong><small>'+l.client+' · '+l.exp+'</small></div>'+badge(l.status)+'</div>'}).join('')+'</div></div>';
 document.getElementById('content').innerHTML=html;
}
function tableProcesses(){return '<div class="wrap"><table><thead><tr><th>Processo</th><th>Cliente</th><th>Etapa</th><th>Responsável</th><th>Status</th></tr></thead><tbody>'+processes.map(function(p){return '<tr><td><b>'+p.id+'</b><br><small>'+p.title+'</small></td><td>'+p.client+'</td><td>'+stages[p.stage]+'</td><td>'+p.owner+'</td><td>'+badge(p.status)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function processPage(){
 head('Processos','Fluxo de legalização');
 var html='<div class="card"><div class="toolbar"><h3>Pipeline</h3><span class="badge">'+processes.length+' processos</span></div><div class="kanban">';
 stages.forEach(function(s,i){var list=processes.filter(function(p){return p.stage===i});html+='<div class="col"><div class="colHead"><span>'+s+'</span><span>'+list.length+'</span></div>'+list.map(function(p){return '<div class="proc"><b>'+p.id+'</b><p>'+p.client+'</p><p>'+p.title+'</p><div class="progress"><i style="width:'+p.progress+'%"></i></div><p>'+p.owner+' · '+p.deadline+'</p></div>'}).join('')+'</div>'});
 html+='</div></div>';document.getElementById('content').innerHTML=html;
}
function clientPage(){head('Clientes','Cadastro e briefing');document.getElementById('content').innerHTML='<div class="card"><div class="toolbar"><h3>Clientes</h3><button class="btn primary" onclick="alert(\'Cadastro completo disponível na versão de produção.\')">+ Cliente</button></div><div class="wrap"><table><thead><tr><th>Cliente</th><th>CNPJ</th><th>Cidade</th><th>Contato</th></tr></thead><tbody>'+clients.map(function(c){return '<tr><td><b>'+c.name+'</b></td><td>'+c.cnpj+'</td><td>'+c.city+'</td><td>'+c.contact+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
function protocolPage(){head('Protocolos','Acompanhamento por órgão');document.getElementById('content').innerHTML='<div class="card"><div class="wrap"><table><thead><tr><th>Processo</th><th>Órgão</th><th>Tipo</th><th>Protocolo</th><th>Status</th></tr></thead><tbody>'+protocols.map(function(p){return '<tr><td>'+p.proc+'</td><td>'+p.org+'</td><td>'+p.kind+'</td><td><b>'+p.num+'</b></td><td>'+badge(p.status)+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
function costPage(){head('Custos','Taxas e reembolsos');document.getElementById('content').innerHTML='<div class="card"><div class="wrap"><table><thead><tr><th>Processo</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Status</th></tr></thead><tbody>'+costs.map(function(c){return '<tr><td>'+c.proc+'</td><td>'+c.desc+'</td><td>'+c.type+'</td><td><b>'+c.amount+'</b></td><td>'+badge(c.status)+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
function licensePage(){head('Licenças','Controle recorrente');document.getElementById('content').innerHTML='<div class="card"><h3>Alertas de vencimento</h3>'+licenses.map(function(l){return '<div class="row"><div><strong>'+l.name+'</strong><small>'+l.client+' · vence em '+l.exp+'</small></div>'+badge(l.status)+'</div>'}).join('')+'</div>'}
function integrationPage(){
 head('Integrações','APIs e conectores');
 document.getElementById('content').innerHTML='<div class="split"><div class="card"><h3>Consulta CNPJ</h3><p style="color:var(--muted);font-size:13px">Teste rápido usando BrasilAPI.</p><div class="searchbox"><input id="cnpj" placeholder="Digite 14 números"><button class="btn primary" onclick="lookupCnpj()">Consultar</button></div><div id="cnpjOut" class="result" style="margin-top:12px">Aguardando consulta...</div></div><div class="card"><h3>Status das integrações</h3><div class="row"><div><strong>BrasilAPI</strong><small>CNPJ / dados públicos</small></div><span class="badge ok">Ativa</span></div><div class="row"><div><strong>IBGE</strong><small>UF e municípios</small></div><span class="badge ok">Ativa</span></div><div class="row"><div><strong>Supabase</strong><small>Auth, banco e storage</small></div><span class="badge warn">Próxima etapa</span></div><div class="row"><div><strong>OpenAI</strong><small>ATLAS IA</small></div><span class="badge warn">Próxima etapa</span></div></div></div>'
}
async function lookupCnpj(){
 var out=document.getElementById('cnpjOut');var n=(document.getElementById('cnpj').value||'').replace(/\D/g,'');if(n.length!==14){out.textContent='Informe os 14 números do CNPJ.';return}
 out.textContent='Consultando...';
 try{var r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+n);if(!r.ok)throw new Error('CNPJ não encontrado');var d=await r.json();out.textContent=JSON.stringify({cnpj:d.cnpj,razao_social:d.razao_social,nome_fantasia:d.nome_fantasia,situacao:d.descricao_situacao_cadastral,municipio:d.municipio,uf:d.uf,capital_social:d.capital_social},null,2)}catch(e){out.textContent='Falha: '+e.message}
}
function newProcess(){alert('No ambiente de produção, este botão abrirá o briefing completo e o workflow automático.')}
</script>
</body>
</html>
