name: ATLAS Legalizacao V5 Checks

on:
  push:
    branches:
      - atlas-legalizacao-v5
      - atlas-legalizacao-v5.1
      - atlas-legalizacao-v5.1-ui-compact
      - atlas-legalizacao-v6-mockup-exato

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run test suite
        run: npm test
      - name: Syntax check V5.1 modules
        run: |
          node --check dashboard-v4.js
          node --check company-360-v5.js
          node --check company-hierarchy-v5-1.js
          node --check establishment-context-v5-1.js
          node --check enterprise-family-v5-1.js
          node --check client-archive.js
          node --check command-center-v4.js
          node --check iconography-v5-1.js
          node --check pwa-v5-1.js
          node --check sw-v5-1.js
          node --check api/cnpj.js
